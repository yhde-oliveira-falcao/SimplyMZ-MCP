name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: tests (no network)
        run: uv run pytest -m "not network" --cov --cov-report=xml
      - name: tools doc is current
        run: uv run python scripts/gen_tools_doc.py --check
      - name: fixtures are reproducible on this OS
        run: uv run python scripts/generate_fixtures.py --check

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    # Runs the milestone gate on Linux and keeps its JSON as an artifact.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: install gitleaks binary for the gate
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: current gate
        run: uv run python scripts/verify.py --current --ci --allow-pending
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-json
          path: docs/progress/gates/*.json
